<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไดอารี่ของเรา</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0FA; --paper:#FFFFFF; --ink:#2B1F3D; --muted:#7A6F8C; --line:#DAD6EA;
  --accent:#D9456E; --accent-ink:#FFFFFF; --soft:#FBE3EA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1C1628; --paper:#271F37; --ink:#F1ECF8; --muted:#A99DBD; --line:#3A3050; --accent:#F0698F; --accent-ink:#2B1F3D; --soft:#3A2438;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1C1628; --paper:#271F37; --ink:#F1ECF8; --muted:#A99DBD; --line:#3A3050; --accent:#F0698F; --accent-ink:#2B1F3D; --soft:#3A2438;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Thai",system-ui,sans-serif;background-image:radial-gradient(circle at 10% 6%,var(--soft) 0 90px,transparent 91px),radial-gradient(circle at 94% 32%,var(--soft) 0 130px,transparent 131px),radial-gradient(circle at 6% 72%,var(--soft) 0 110px,transparent 111px);background-attachment:fixed}
main{max-width:880px;margin:0 auto;padding:28px 18px 80px}
h1{font:600 clamp(26px,6vw,36px)/1.3 "Mali",system-ui,sans-serif;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:center}
#who{font:inherit;color:var(--accent);background:transparent;border:0;border-bottom:2px dashed var(--accent);width:6.5em;padding:0 2px;outline-offset:4px}
.sub{color:var(--muted);margin:0 0 24px;text-align:center}
form{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;max-width:680px;margin:0 auto;box-shadow:0 8px 24px rgba(217,69,110,.15)}
label{font-weight:500;display:grid;gap:6px}
input[type=date],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1 1 180px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:22px;line-height:1;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.moods button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pick{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--accent);color:var(--accent);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:500;width:fit-content}
.pick input{display:none}
.previews{display:flex;gap:8px;flex-wrap:wrap}
.previews div{position:relative}
.previews img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.previews button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:13px;line-height:1}
.save{font:600 16px "Mali",sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
#msg{color:var(--accent);min-height:1.5em;margin:0}
.entries{margin-top:44px;display:grid;gap:30px;position:relative}
.entries::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dotted var(--accent);opacity:.5;transform:translateX(-1.5px)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.entry{position:relative;width:46%;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px 18px 18px;box-shadow:0 6px 18px rgba(43,31,61,.12)}
.entry.l{justify-self:start;transform:rotate(-.8deg)}
.entry.r{justify-self:end;transform:rotate(.8deg)}
.entry::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:var(--soft);border:1px solid var(--line);transform:rotate(-3deg)}
.entry::after{content:"💗";position:absolute;top:16px;width:28px;height:28px;line-height:28px;text-align:center;font-size:16px;background:var(--bg);border-radius:50%}
.entry.l::after{right:calc(-8.7% - 14px)}
.entry.r::after{left:calc(-8.7% - 14px)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.date{font:600 24px "Mali",sans-serif;line-height:1}
.day{justify-self:center;font:600 18px/1.4 "Mali",sans-serif;margin:6px 0 0;padding:6px 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);position:relative;z-index:1}
@media (max-width:640px){.entry{width:90%}.entries::before,.entry::after{display:none}}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:4px 8px;border-radius:8px}
.del:hover{color:var(--accent)}
.text{white-space:pre-wrap;margin:10px 0 0;overflow-wrap:anywhere}
.photos{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
.photos button{border:0;padding:8px 8px 22px;background:#fff;box-shadow:0 2px 8px rgba(43,31,61,.25);cursor:pointer;transform:rotate(-2deg);flex:0 1 calc(50% - 10px)}
.photos button:nth-child(even){transform:rotate(1.8deg)}
.photos button:only-child{flex-basis:80%}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
#lb{position:fixed;inset:0;background:rgba(10,6,18,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:6px}
.ghbox{max-width:680px;margin:0 auto 18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.ghbox summary{cursor:pointer;font-weight:500}
.ghbox form{box-shadow:none;border:0;padding:12px 0 0;max-width:none;margin:0}
.ghbox input[type=text],.ghbox input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.ghbox small{color:var(--muted)}
#sync{color:var(--muted);font-size:14px;margin:6px 0 0}
.row{align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
</style>
</head>
<body>
<main>
  <h1>💗 ไดอารี่ของเรากับ <input id="who" value="แฟน" aria-label="ชื่อแฟน" maxlength="20"></h1>
  <p class="sub">วันนี้ทำอะไรด้วยกันบ้าง จดไว้ตรงนี้</p>

  <details class="ghbox" id="ghbox">
    <summary>เก็บบันทึกไว้ใน GitHub</summary>
    <p id="sync"></p>
    <form id="ghf">
      <label>repo ที่ใช้เก็บข้อมูล<input type="text" id="repo" placeholder="ชื่อผู้ใช้/couple-diary-data" autocomplete="off"></label>
      <label>branch<input type="text" id="branch" value="main" autocomplete="off"></label>
      <label>token<input type="password" id="token" placeholder="github_pat_…" autocomplete="off"></label>
      <small>token เก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ควรสร้างแบบ fine-grained ให้เข้าถึงเฉพาะ repo นี้ และให้สิทธิ์ Contents: Read and write</small>
      <p id="ghmsg" role="status" style="margin:0;color:var(--accent)"></p>
      <div class="row"><button class="save" type="submit">เชื่อมต่อ</button><button type="button" class="link" id="off">เลิกเชื่อมต่อ</button></div>
    </form>
  </details>
  <form id="f">
    <div class="row">
      <label>วันที่<input type="date" id="date" required></label>
      <div><div style="font-weight:500;margin-bottom:6px">วันนี้รู้สึกยังไง</div>
        <div class="moods" id="moods"></div></div>
    </div>
    <label>วันนี้ทำอะไรบ้าง<textarea id="text" placeholder="เช่น ไปกินข้าวด้วยกัน แล้วเดินเล่นที่สวน"></textarea></label>
    <div>
      <label class="pick">เพิ่มรูป<input type="file" id="file" accept="image/*" multiple></label>
      <div class="previews" id="prev" style="margin-top:10px"></div>
    </div>
    <p id="msg" role="status"></p>
    <button class="save" id="saveBtn" type="submit">บันทึก</button>
  </form>

  <section class="entries" id="list" aria-live="polite"></section>
</main>
<div id="lb" role="dialog" aria-label="ดูรูป"><img alt=""></div>

<script>
const KEY="couple-diary-v1", NAME_KEY="couple-diary-name", CFG_KEY="couple-diary-gh";
const MOODS=["😊","🥰","😋","😴","🤣","🥺"];
let entries=[], photos=[], mood=MOODS[0], cfg=null, sha=null;
const imgCache={};
const $=id=>document.getElementById(id);

/* ---------- GitHub as database ---------- */
const api=p=>`https://api.github.com/repos/${cfg.repo}/contents/${p}`;
const hdr=raw=>({Authorization:"Bearer "+cfg.token,Accept:raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const ref=()=>"?ref="+encodeURIComponent(cfg.branch);
function b64enc(s){let t="";new TextEncoder().encode(s).forEach(c=>t+=String.fromCharCode(c));return btoa(t)}
function b64dec(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)))}
async function ghGet(path){
  const r=await fetch(api(path)+ref(),{headers:hdr(),cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function ghPut(path,content,message,fileSha){
  const body={message,content,branch:cfg.branch};
  if(fileSha) body.sha=fileSha;
  const r=await fetch(api(path),{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function ghDel(path,message){
  const f=await ghGet(path); if(!f) return;
  await fetch(api(path),{method:"DELETE",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message,sha:f.sha,branch:cfg.branch})});
}
async function ghImg(path){
  if(imgCache[path]) return imgCache[path];
  const r=await fetch(api(path)+ref(),{headers:hdr(true),cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return imgCache[path]=URL.createObjectURL(await r.blob());
}
async function pull(){
  const f=await ghGet("data/entries.json");
  if(!f){sha=null;return []}
  sha=f.sha;
  return JSON.parse(b64dec(f.content)).entries||[];
}
/* always apply the change on top of the latest copy in GitHub */
async function mutate(fn,msg){
  const next=fn(await pull());
  await ghPut("data/entries.json",b64enc(JSON.stringify({entries:next},null,1)),msg,sha);
  entries=next; cacheLocal();
}
async function upPhotos(id,arr){
  const out=[]; let n=0;
  for(const p of arr){
    if(p.startsWith("data:")){
      const path=`images/${id}-${n++}.jpg`;
      await ghPut(path,p.split(",")[1],"เพิ่มรูป");
      out.push(path);
    } else out.push(p);
  }
  return out;
}

/* ---------- local storage (cache, or main store when not connected) ---------- */
const store=()=>cfg?KEY+"-gh":KEY;
function cacheLocal(){try{localStorage.setItem(store(),JSON.stringify(entries))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){return false}}

/* ---------- helpers ---------- */
function today(){
  const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function fmt(s){
  return new Date(s+"T00:00:00").toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function imgTag(p,alt){
  return p.startsWith("data:")?`<img src="${p}" alt="${alt}">`:`<img data-p="${esc(p)}" alt="${alt}">`;
}
function hydrate(){
  if(!cfg) return;
  document.querySelectorAll("img[data-p]").forEach(async im=>{
    try{im.src=await ghImg(im.dataset.p)}catch(e){im.alt="โหลดรูปไม่ได้"}
  });
}
function setSync(){
  $("sync").textContent=cfg?"เชื่อมต่อ GitHub: "+cfg.repo:"ตอนนี้เก็บในเครื่องนี้อย่างเดียว";
  $("off").style.display=cfg?"":"none";
}

/* ---------- form ---------- */
function renderMoods(){
  $("moods").innerHTML=MOODS.map(m=>`<button type="button" aria-pressed="${m===mood}" data-m="${m}">${m}</button>`).join("");
}
$("moods").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  mood=b.dataset.m; renderMoods();
});
function renderPrev(){
  $("prev").innerHTML=photos.map((p,i)=>`<div><img src="${p}" alt="รูปที่เลือก"><button type="button" data-i="${i}" aria-label="ลบรูป">×</button></div>`).join("");
}
$("prev").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  photos.splice(+b.dataset.i,1); renderPrev();
});
function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const k=Math.min(1,900/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.72));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
$("file").addEventListener("change",async e=>{
  for(const f of e.target.files){
    try{photos.push(await shrink(f))}catch(err){$("msg").textContent="เปิดรูปบางรูปไม่ได้ ลองเลือกรูปอื่น"}
  }
  e.target.value=""; renderPrev();
});

/* ---------- list ---------- */
function render(){
  const list=$("list");
  if(!entries.length){list.innerHTML='<p class="empty">ยังไม่มีบันทึก เขียนเรื่องของวันนี้ได้เลย</p>';return}
  const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let last="";
  list.innerHTML=sorted.map((en,i)=>{
    const h=en.date!==last?`<h2 class="day">${fmt(en.date)}</h2>`:""; last=en.date;
    const alt="รูปจากวันที่ "+fmt(en.date);
    return h+`
    <article class="entry ${i%2?'r':'l'}" id="e${en.id}">
      <div class="head"><span class="date">${en.mood}</span>
        <button class="del" data-id="${en.id}">ลบ</button></div>
      ${en.text?`<p class="text">${esc(en.text)}</p>`:""}
      ${en.photos.length?`<div class="photos">${en.photos.map(p=>`<button type="button" aria-label="ดูรูปใหญ่">${imgTag(p,alt)}</button>`).join("")}</div>`:""}
    </article>`}).join("");
  hydrate();
}
$("list").addEventListener("click",async e=>{
  const d=e.target.closest(".del");
  if(d){
    if(!confirm("ลบบันทึกนี้ใช่ไหม")) return;
    const id=+d.dataset.id;
    if(cfg){
      d.disabled=true;
      const en=entries.find(x=>x.id===id);
      try{
        await mutate(l=>l.filter(x=>x.id!==id),"ลบบันทึก");
        for(const p of (en?en.photos:[])) if(!p.startsWith("data:")) await ghDel(p,"ลบรูป").catch(()=>{});
      }catch(err){d.disabled=false;alert("ลบบน GitHub ไม่สำเร็จ ลองใหม่อีกครั้ง");return}
    } else {entries=entries.filter(x=>x.id!==id); save()}
    render(); return;
  }
  const p=e.target.closest(".photos button");
  if(p){const lb=$("lb"); lb.querySelector("img").src=p.querySelector("img").src; lb.classList.add("on")}
});
$("lb").addEventListener("click",()=>$("lb").classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").classList.remove("on")});

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("text").value.trim();
  if(!text && !photos.length){$("msg").textContent="เขียนข้อความหรือเพิ่มรูปอย่างน้อยหนึ่งอย่าง";return}
  const id=Date.now();
  const entry={id,date:$("date").value||today(),mood,text,photos:[...photos]};
  $("saveBtn").disabled=true;
  try{
    if(cfg){
      $("msg").textContent="กำลังบันทึกขึ้น GitHub…";
      entry.photos=await upPhotos(id,entry.photos);
      await mutate(l=>[...l,entry],"เพิ่มบันทึก "+entry.date);
    } else {
      entries.push(entry);
      if(!save()){entries.pop();throw new Error("quota")}
    }
    $("text").value=""; photos=[]; renderPrev(); $("msg").textContent="บันทึกแล้ว"; render();
    const el=document.getElementById("e"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>{$("msg").textContent=""},2500);
  }catch(err){
    $("msg").textContent=cfg?"บันทึกขึ้น GitHub ไม่สำเร็จ ตรวจสอบการตั้งค่าและ token แล้วลองใหม่":"พื้นที่เก็บข้อมูลเต็ม ลองลดจำนวนรูป หรือลบบันทึกเก่าบางอัน";
  }finally{$("saveBtn").disabled=false}
});
$("who").addEventListener("input",()=>{try{localStorage.setItem(NAME_KEY,$("who").value)}catch(e){}});

/* ---------- connect / disconnect ---------- */
$("ghf").addEventListener("submit",async e=>{
  e.preventDefault();
  const c={repo:$("repo").value.trim(),branch:$("branch").value.trim()||"main",token:$("token").value.trim()||(cfg&&cfg.token)||""};
  if(!/^[\w.-]+\/[\w.-]+$/.test(c.repo)||!c.token){$("ghmsg").textContent="กรอก repo แบบ ชื่อผู้ใช้/ชื่อrepo และ token ให้ครบ";return}
  const prev=cfg; cfg=c; $("ghmsg").textContent="กำลังเชื่อมต่อ…";
  try{
    const remote=await pull();
    let local=[]; try{local=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(_){}
    if(!remote.length && local.length && confirm("ต้องการอัปโหลดบันทึกที่มีอยู่ในเครื่องนี้ขึ้น GitHub ด้วยไหม")){
      $("ghmsg").textContent="กำลังอัปโหลด…";
      for(const en of local) en.photos=await upPhotos(en.id,en.photos);
      await mutate(()=>local,"นำเข้าบันทึกจากเครื่อง");
    } else entries=remote;
    try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(_){}
    $("token").value=""; $("ghmsg").textContent="เชื่อมต่อแล้ว"; cacheLocal();
  }catch(err){
    cfg=prev; $("ghmsg").textContent="เชื่อมต่อไม่ได้ ตรวจสอบ repo, branch และ token (ต้องมีสิทธิ์ Contents: Read and write)";
  }
  setSync(); render();
});
$("off").addEventListener("click",()=>{
  if(!confirm("เลิกเชื่อมต่อ GitHub ในเครื่องนี้ใช่ไหม ข้อมูลบน GitHub จะไม่ถูกลบ")) return;
  cfg=null; try{localStorage.removeItem(CFG_KEY)}catch(e){}
  try{entries=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){entries=[]}
  $("ghmsg").textContent=""; setSync(); render();
});

/* ---------- start ---------- */
(function init(){
  try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||"null")}catch(e){cfg=null}
  try{const n=localStorage.getItem(NAME_KEY); if(n) $("who").value=n}catch(e){}
  try{entries=JSON.parse(localStorage.getItem(store())||"[]")}catch(e){entries=[]}
  if(cfg){$("repo").value=cfg.repo;$("branch").value=cfg.branch;$("token").placeholder="บันทึกไว้แล้ว (ไม่ต้องกรอกใหม่)"}
  $("date").value=today(); renderMoods(); setSync(); render();
  if(cfg) pull().then(l=>{entries=l;cacheLocal();render();$("sync").textContent+=" (ซิงค์แล้ว)"})
    .catch(()=>{$("sync").textContent="เชื่อมต่อ GitHub ไม่ได้ในตอนนี้ แสดงข้อมูลที่เก็บไว้ในเครื่อง"});
})();

</script>
</body>
</html>
